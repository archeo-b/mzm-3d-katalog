<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog 3d modelů sbírkových předmětů</title>
    
    <script type="module" src="model-viewer.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px 0;
            color: #222;
        }

        .catalog-grid {
            max-width: 1200px;
            margin: 0 auto 10px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .catalog-card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #eaeaea;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .catalog-card:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        .card-viewer-container {
            height: 250px;
            background: #f0f0f0;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-info h2 {
            margin: 0;
            font-size: 18px;
            color: #111;
        }

        .card-tag {
            align-self: flex-start;
            background: #e0e0e0;
            color: #444;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .card-meta {
            font-size: 13px;
            color: #777;
            margin: 5px 0 0 0;
        }

        .pagination-container {
            max-width: 1200px;
            margin: 20px auto 50px auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            color: #333;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .page-btn:hover {
            border-color: #333;
        }

        .page-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
    </style>
</head>
<body>

    <main class="catalog-grid" id="catalogGrid">

        <a href="A50476.html" class="catalog-card">
            <div class="card-viewer-container">
                <model-viewer src="A50476-web-glb.glb" poster="A50476-jpeg.jpg" loading="lazy" reveal="interaction" interaction-prompt="none" style="pointer-events: none;"></model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">Doba římská</span>
                <h2>Bronzová ataše</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: A50476</p>
            </div>
        </a>

        <a href="A56265.html" class="catalog-card">
            <div class="card-viewer-container">
                <model-viewer src="A56265.glb" poster="1.jpg" loading="lazy" reveal="interaction" interaction-prompt="none" style="pointer-events: none;"></model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">Doba římská</span>
                <h2>Stříbrná spona</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: A56265</p>
            </div>
        </a>

        <a href="Z277.html" class="catalog-card">
            <div class="card-viewer-container">
                <model-viewer src="Z277.glb" poster="Z277-1.jpg" loading="lazy" reveal="interaction" interaction-prompt="none" style="pointer-events: none;"></model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">1880-1916</span>
                <h2>Vojenská přezka - Rusko</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: Z277</p>
            </div>
        </a>

    </main>

    <div class="pagination-container" id="paginationContainer"></div>

    <script>
        const cards = Array.from(document.querySelectorAll('.catalog-card'));
        const paginationContainer = document.getElementById('paginationContainer');

        const itemsPerPage = 24;
        let currentPage = 1;

        function showPage(page) {
            currentPage = page;
            
            cards.forEach(card => card.style.display = 'none');

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = cards.slice(start, end);

            pageItems.forEach(card => card.style.display = 'flex');

            const buttons = paginationContainer.querySelectorAll('.page-btn');
            buttons.forEach(btn => {
                if (parseInt(btn.getAttribute('data-page')) === currentPage) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(cards.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn';
                btn.innerText = i;
                btn.setAttribute('data-page', i);
                btn.addEventListener('click', () => showPage(i));
                paginationContainer.appendChild(btn);
            }
        }

        renderPagination();
        showPage(1);
    </script>

</body>
</html>
