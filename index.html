<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog 3d modelů sbírkových předmětů</title>
    
    <script type="module" src="model-viewer.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #222;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 40px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .header-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .header-text {
            text-align: left;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 14px;
        }

        .search-filter-section {
            max-width: 1200px;
            margin: 30px auto 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-wrapper {
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #333;
        }

        .filter-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: #333;
        }

        .filter-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        .catalog-grid {
            max-width: 1200px;
            margin: 30px auto 10px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .catalog-card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #eaeaea;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .catalog-card:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        .card-viewer-container {
            height: 250px;
            background: #f0f0f0;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-info h2 {
            margin: 0;
            font-size: 18px;
            color: #111;
        }

        .card-tag {
            align-self: flex-start;
            background: #e0e0e0;
            color: #444;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .card-meta {
            font-size: 13px;
            color: #777;
            margin: 5px 0 0 0;
        }

        .pagination-container {
            max-width: 1200px;
            margin: 20px auto 50px auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            color: #333;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .page-btn:hover {
            border-color: #333;
        }

        .page-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <img src="logo.png" alt="Logo" class="header-logo">
            <div class="header-text">
                <h1>DIGITÁLNÍ SBÍRKY</h1>
                <p>Katalog 3d modelů sbírkových předmětů</p>
            </div>
        </div>
    </header>

    <section class="search-filter-section">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Vyhledat předmět (název, lokalita, inv. č., datace...)">
        </div>
        <div class="filter-wrapper">
            <button class="filter-btn active" data-filter="all">Vše</button>
            <button class="filter-btn" data-filter="archeologie">Archeologie</button>
            <button class="filter-btn" data-filter="historie">Historie</button>
            <button class="filter-btn" data-filter="etnografie">Etnografie a regionália</button>
            <button class="filter-btn" data-filter="prirodoveda">Přírodověda</button>
            <button class="filter-btn" data-filter="militaria">Militária</button>
        </div>
    </section>

    <main class="catalog-grid" id="catalogGrid">

        <a href="A50476.html" class="catalog-card" data-category="archeologie" data-name="Bronzová ataše" data-tag="Doba římská" data-meta="Lokalita: Boskovicko Inv. č.: A50476">
            <div class="card-viewer-container">
                <model-viewer src="A50476-web-glb.glb" poster="A50476-jpeg.jpg" loading="lazy" reveal="interaction" interaction-prompt="none" style="pointer-events: none;"></model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">Doba římská</span>
                <h2>Bronzová ataše</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: A50476</p>
            </div>
        </a>

        <a href="A56265.html" class="catalog-card" data-category="archeologie" data-name="Stříbrná spona" data-tag="Doba římská" data-meta="Lokalita: Boskovicko Inv. č.: A56265">
            <div class="card-viewer-container">
                <model-viewer src="A56265.glb" poster="1.jpg" loading="lazy" reveal="interaction" interaction-prompt="none" style="pointer-events: none;"></model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">Doba římská</span>
                <h2>Stříbrná spona</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: A56265</p>
            </div>
        </a>

        <a href="Z277.html" class="catalog-card" data-category="militaria" data-name="Vojenská přezka - Rusko" data-tag="1880-1916" data-meta="Lokalita: Boskovicko Inv. č.: Z277">
            <div class="card-viewer-container">
                <model-viewer src="Z277.glb" poster="Z277-1.jpg" loading="lazy" reveal="interaction" interaction-prompt="none" style="pointer-events: none;"></model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">1880-1916</span>
                <h2>Vojenská přezka - Rusko</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: Z277</p>
            </div>
        </a>

    </main>

    <div class="pagination-container" id="paginationContainer"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.catalog-card');
        const paginationContainer = document.getElementById('paginationContainer');

        const itemsPerPage = 24;
        let currentPage = 1;
        let currentFilter = 'all';
        let searchText = '';
        let filteredCards = [];

        function updateCatalog() {
            filteredCards = [];
            
            cards.forEach(card => {
                const category = card.getAttribute('data-category');
                const name = card.getAttribute('data-name').toLowerCase();
                const tag = card.getAttribute('data-tag').toLowerCase();
                const meta = card.getAttribute('data-meta').toLowerCase();
                
                const matchesFilter = (currentFilter === 'all' || category === currentFilter);
                const matchesSearch = (
                    name.includes(searchText) || 
                    tag.includes(searchText) || 
                    meta.includes(searchText)
                );

                if (matchesFilter && matchesSearch) {
                    filteredCards.push(card);
                } else {
                    card.style.display = 'none';
                }
            });

            renderPagination();
            showPage(1);
        }

        function showPage(page) {
            currentPage = page;
            
            cards.forEach(card => card.style.display = 'none');

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredCards.slice(start, end);

            pageItems.forEach(card => card.style.display = 'flex');

            const buttons = paginationContainer.querySelectorAll('.page-btn');
            buttons.forEach(btn => {
                if (parseInt(btn.getAttribute('data-page')) === currentPage) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredCards.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn';
                btn.innerText = i;
                btn.setAttribute('data-page', i);
                btn.addEventListener('click', () => showPage(i));
                paginationContainer.appendChild(btn);
            }
        }

        searchInput.addEventListener('input', (e) => {
            searchText = e.target.value.toLowerCase().trim();
            updateCatalog();
        });

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentFilter = button.getAttribute('data-filter');
                updateCatalog();
            });
        });

        updateCatalog();
    </script>

</body>
</html>
